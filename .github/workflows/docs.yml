name: docs
on:
  push:
    branches: [master]
    paths: ['src/**', 'website/**', 'package.json', 'Readme.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['src/**', 'website/**', 'package.json', 'Readme.md', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # prebuild builds the library, packs it into website/.pack and installs it there.
      - run: npm run build --prefix website
      - run: npm run check-links --prefix website
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/out }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
