name: test-full
# The full suite, called by release.yml on every push to master and before publishing.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
        timeout-minutes: 5
      # System libraries are not cached; a stuck apt mirror fails here in minutes, not after the job limit.
      - run: npx playwright install-deps ${{ matrix.browser }}
        timeout-minutes: 6
      - run: npm test
        env: { VITEST_BROWSERS: '${{ matrix.browser }}' }
        timeout-minutes: 8
      - run: npm run build
      - run: npm test
        env: { VITEST_BROWSERS: '${{ matrix.browser }}', RCA_TARGET: build }
        timeout-minutes: 8
      - run: npm test
        env: { VITEST_BROWSERS: '${{ matrix.browser }}', RCA_NO_SHOWMODAL: '1' }
        timeout-minutes: 8
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix fixtures/v3-baseline
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        timeout-minutes: 3
      - run: npm run test:types
      - run: npm run build
      - run: npm run check:package
      - run: "! grep -q '!important' src/react-confirm-alert.css"
      - run: npm publish --dry-run
      - run: npm run test:fixtures
        timeout-minutes: 12
