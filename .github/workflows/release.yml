name: release
on:
  push:
    branches: [master]
concurrency: release
jobs:
  version:
    # No environment: the "Version Packages" PR updates on every push without approval.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.cs.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - id: cs
        # Only `version`, no `publish`: the action never writes an npm token to ~/.npmrc.
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  changes:
    # A push that only bumps versions and release notes (the Version Packages merge) has the same code
    # as the push before it, which already ran the full suite. code=false lets verify skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env: { BEFORE: '${{ github.event.before }}' }
        run: |
          set -euo pipefail
          code=true
          # Equal once the root version fields are removed from both sides.
          same='const { execFileSync } = require("child_process")
            const strip = (text, lock) => { const j = JSON.parse(text); delete j.version; if (lock) delete j.packages[""].version; return JSON.stringify(j) }
            for (const f of ["package.json", "package-lock.json"]) {
              const before = execFileSync("git", ["show", `${process.env.BEFORE}:${f}`], { encoding: "utf8" })
              if (strip(before, f !== "package.json") !== strip(require("fs").readFileSync(f, "utf8"), f !== "package.json")) process.exit(1)
            }'
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" HEAD | grep -vxE 'package\.json|package-lock\.json|CHANGELOG\.md|\.changeset/.*' || true)
            if [ -z "$other" ] && node -e "$same"; then code=false; fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
  verify:
    # The full suite on every push to master that changes code; publish waits for it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test-full.yml
  publish:
    # Runs once no changeset is pending, i.e. after the Version Packages PR is merged. A skipped verify
    # counts only when changes reported no code change; a failed or cancelled one blocks publish.
    needs: [version, changes, verify]
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.changes.result == 'success'
      && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.changes.outputs.code == 'false'))
      && needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest   # trusted publishing does not support self-hosted runners
    timeout-minutes: 15
    environment: npm-publish # must match the trusted publisher on npmjs; needs the owner's approval
    permissions:
      contents: write        # the version tag and the GitHub Release
      id-token: write        # OIDC token for npm trusted publishing (provenance is automatic)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # the tag step finds the commit that set the version
      - uses: actions/setup-node@v4
        with: { node-version: 24 } # no registry-url and no NODE_AUTH_TOKEN: either can block OIDC
      - run: npm install -g npm@latest && npm --version # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm ci --prefix fixtures/v3-baseline
      # changeset publish skips versions already on the registry. CHANGESETS_OUTPUT makes it write one
      # JSON line per release it tags ({"type":"git-tag","tag":"v3.2.0",...}); the next step reads that
      # instead of asking npm, which answers 404 while a new version is still validating.
      - run: npm run release
        env: { CHANGESETS_OUTPUT: '${{ runner.temp }}/changesets-publish.ndjson' }
      # changeset publish makes a lightweight tag that never reaches GitHub. For each release it reported,
      # tag the commit that set that version (annotated), push the tag by name and create the GitHub
      # Release from the version's CHANGELOG section. An existing tag or release is skipped; anything
      # else that goes wrong fails the job.
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPORT: '${{ runner.temp }}/changesets-publish.ndjson'
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ]; then echo "::notice::changeset publish released nothing"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(node -e "for (const l of require('fs').readFileSync(process.env.REPORT, 'utf8').split('\n').filter(Boolean)) { const e = JSON.parse(l); if (e.type === 'git-tag') console.log(e.tag) }"); do
            version="${tag#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already on GitHub"
            else
              commit=$(git log -1 --format=%H -S"\"version\": \"$version\"" -- package.json)
              [ -n "$commit" ] || { echo "::error::no commit sets version $version in package.json"; exit 1; }
              git tag -f -a "$tag" "$commit" -m "$tag"
              git push origin "refs/tags/$tag"
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag already exists"
            else
              awk -v v="$version" '$0 == "## " v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > release-notes.md
              [ -s release-notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
              gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
            fi
          done
